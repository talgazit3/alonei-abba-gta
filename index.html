<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>אלוני אבא 3D - הניסיון החדש</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }

        /* מסך בחירת דמויות */
        #char-select {
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(30,41,59,0.98) 0%, rgba(15,23,42,0.99) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 300; color: white; direction: rtl; padding: 20px;
        }
        #char-select h1 { font-size: 2.2rem; margin-bottom: 8px; color: #38bdf8; text-shadow: 0 0 15px rgba(56,189,248,0.4); text-align: center; }
        #char-select p { font-size: 1rem; color: #94a3b8; margin-bottom: 25px; }
        .char-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
        .char-card {
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; text-align: center; cursor: pointer;
            transition: all 0.25s ease; width: 150px; position: relative; overflow: hidden;
        }
        .char-card:hover { transform: translateY(-8px) scale(1.03); border-color: #38bdf8; background: rgba(56, 189, 248, 0.12); box-shadow: 0 10px 25px rgba(56,189,248,0.25); }
        .char-avatar { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .char-card h3 { font-size: 1.1rem; margin: 8px 0 2px; color: #f8fafc; }
        .char-card span { font-size: 0.8em; color: #38bdf8; font-weight: bold; }

        /* ממשק במשחק (UI) */
        #game-ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; display: none; }
        
        .header-card {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            padding: 12px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
            color: white; direction: rtl; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .header-card h2 { margin: 0; font-size: 1.1rem; color: #38bdf8; }
        .header-card div { font-size: 0.85rem; color: #cbd5e1; margin-top: 3px; }

        /* ג'ויסטיק ויירטואלי לניידים */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 50%;
            pointer-events: auto; backdrop-filter: blur(4px); touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; background: #38bdf8;
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(56,189,248,0.6); pointer-events: none;
        }

        /* מפה קטנה */
        #minimap {
            position: absolute; bottom: 20px; right: 20px;
            width: 110px; height: 110px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3); background: rgba(15,23,42,0.8);
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #minimap-player {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            background: #ef4444; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ef4444;
        }

        #instructions-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); color: #e2e8f0;
            padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; direction: rtl; text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- מסך בחירת דמות -->
    <div id="char-select">
        <h1>אלוני אבא 3D</h1>
        <p>בחר את הדמות שלך כדי להיכנס לעולם</p>
        <div class="char-grid">
            <div class="char-card" onclick="startGame('tal')">
                <div class="char-avatar" style="background: #ea580c;">👨‍🦰</div>
                <h3>טל גזית</h3>
                <span>חרבצ</span>
            </div>
            <div class="char-card" onclick="startGame('ido')">
                <div class="char-avatar" style="background: #1e293b;">👦</div>
                <h3>עידו דויץ</h3>
                <span>דויץ</span>
            </div>
            <div class="char-card" onclick="startGame('oz')">
                <div class="char-avatar" style="background: #16a34a;">🧒</div>
                <h3>עוז</h3>
                <span>קופמן</span>
            </div>
        </div>
    </div>

    <!-- ממשק המשחק -->
    <div id="game-ui">
        <div class="header-card">
            <h2>אלוני אבא</h2>
            <div id="player-label">דמות: טל גזית</div>
        </div>

        <div id="instructions-bar">
            מחשב: WASD / חיצים לתנועה | עכבר לסיבוב מבט<br>מובייל: ג'ויסטיק משמאל | גרירת אצבע מימין
        </div>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="minimap"><div id="minimap-player"></div></div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup, leftLeg, rightLeg, leftArm, rightArm;
        let walkTime = 0;

        // מצלמה ותנועה
        let cameraAngleX = 0, cameraAngleY = 0.3;
        let isMouseDown = false, prevMouseX = 0, prevMouseY = 0;
        const keys = {};
        let moveVector = { x: 0, z: 0 };

        // פיזיקה
        let velocityY = 0;
        const gravity = -0.015;
        let isGrounded = true;

        // ג'ויסטיק
        let joystickActive = false;
        let joyTouchId = null;
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f5f9);
            scene.fog = new THREE.FogExp2(0xcfe2fe, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            setupLighting();
            buildWorld();
            setupEvents();
        }

        function setupLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfff7ed, 0.9);
            sun.position.set(60, 80, 40);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 0.5;
            sun.shadow.camera.far = 250;
            const d = 60;
            sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
            sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
            scene.add(sun);
        }

        function buildWorld() {
            // קרקע - דשא
            const groundGeo = new THREE.PlaneGeometry(250, 250);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ad66d, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // שביל אספלט מרכזי
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 200), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.02;
            road.receiveShadow = true;
            scene.add(road);

            // מדרכות
            const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.5 });
            const sw1 = new THREE.Mesh(new THREE.BoxGeometry(2, 0.15, 200), sidewalkMat);
            sw1.position.set(-9, 0.075, 0); sw1.receiveShadow = true; scene.add(sw1);
            const sw2 = new THREE.Mesh(new THREE.BoxGeometry(2, 0.15, 200), sidewalkMat);
            sw2.position.set(9, 0.075, 0); sw2.receiveShadow = true; scene.add(sw2);

            // מבנים באלוני אבא
            buildHouse(25, 0, -20, 0xdfe7f2, "בית אבירם");
            buildHouse(-25, 0, -10, 0xfef3c7, "מועדון נוער");
            buildShelter(20, 0, 30);

            // עצים ופנסי רחוב
            for (let z = -80; z <= 80; z += 25) {
                createTree(-14, z);
                createTree(14, z + 12);
                createStreetLight(-10, z + 6);
                createStreetLight(10, z + 18);
            }
        }

        function buildHouse(x, y, z, colorHex, name) {
            const group = new THREE.Group();
            
            // גוף
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(16, 8, 12),
                new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6 })
            );
            body.position.y = 4; body.castShadow = true; body.receiveShadow = true;
            group.add(body);

            // גג רעפים
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(12, 5, 4),
                new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.4 })
            );
            roof.position.y = 10.5; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
            group.add(roof);

            // דלת
            const door = new THREE.Mesh(new THREE.BoxGeometry(2.5, 4.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            door.position.set(0, 2.25, 6.05); group.add(door);

            group.position.set(x, y, z);
            scene.add(group);
        }

        function buildShelter(x, y, z) {
            const shelter = new THREE.Mesh(
                new THREE.BoxGeometry(10, 4.5, 10),
                new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 })
            );
            shelter.position.set(x, 2.25, z);
            shelter.castShadow = true; shelter.receiveShadow = true;
            scene.add(shelter);
        }

        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            trunk.position.y = 2; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2.5, 1), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 }));
            leaves.position.y = 5; leaves.castShadow = true;
            tree.add(trunk, leaves);
            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        function createStreetLight(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7), new THREE.MeshStandardMaterial({ color: 0x334155 }));
            pole.position.set(x, 3.5, z); pole.castShadow = true;
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
            bulb.position.set(x, 7, z);
            scene.add(pole, bulb);
        }

        function createCharacter(type) {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();

            let shirtColor = 0x2563eb, hairColor = 0x1e293b, scaleY = 1;
            let hasBraces = false, hasChain = false;

            if (type === 'tal') { shirtColor = 0x16a34a; hairColor = 0xea580c; hasBraces = true; hasChain = true; }
            else if (type === 'ido') { shirtColor = 0x0284c7; hairColor = 0x0f172a; scaleY = 1.15; }
            else if (type === 'oz') { shirtColor = 0x9333ea; hairColor = 0x451a03; scaleY = 0.85; hasBraces = true; }

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.6 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
            const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.9 });

            // טורסו
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6 * scaleY, 0.7), shirtMat);
            torso.position.y = 1.6 * scaleY; torso.castShadow = true; playerGroup.add(torso);

            // ראש
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), skinMat);
            head.position.y = 2.85 * scaleY; head.castShadow = true; playerGroup.add(head);

            // שיער
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.35, 0.96), hairMat);
            hair.position.y = 3.3 * scaleY; playerGroup.add(hair);

            if (hasChain) {
                const chain = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.04, 8, 16), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8 }));
                chain.rotation.x = Math.PI / 2; chain.position.set(0, 2.3 * scaleY, 0.1); playerGroup.add(chain);
            }

            // רגליים וידיים
            const legGeo = new THREE.BoxGeometry(0.42, 1.2 * scaleY, 0.42);
            leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.28, 0.6 * scaleY, 0);
            leftLeg.geometry.translate(0, -0.3 * scaleY, 0); leftLeg.castShadow = true;

            rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.28, 0.6 * scaleY, 0);
            rightLeg.geometry.translate(0, -0.3 * scaleY, 0); rightLeg.castShadow = true;

            const armGeo = new THREE.BoxGeometry(0.32, 1.2 * scaleY, 0.32);
            leftArm = new THREE.Mesh(armGeo, shirtMat); leftArm.position.set(-0.75, 2.1 * scaleY, 0);
            leftArm.geometry.translate(0, -0.3 * scaleY, 0); leftArm.castShadow = true;

            rightArm = new THREE.Mesh(armGeo, shirtMat); rightArm.position.set(0.75, 2.1 * scaleY, 0);
            rightArm.geometry.translate(0, -0.3 * scaleY, 0); rightArm.castShadow = true;

            playerGroup.add(leftLeg, rightLeg, leftArm, rightArm);
            playerGroup.position.set(0, 0, 10);
            scene.add(playerGroup);
        }

        function startGame(type) {
            createCharacter(type);
            document.getElementById('char-select').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';

            const names = { 'tal': 'טל גזית (חרבצ)', 'ido': 'עידו דויץ (דויץ)', 'oz': 'עוז (קופמן)' };
            document.getElementById('player-label').innerText = 'דמות: ' + names[type];
        }

        function setupEvents() {
            // מקלדת
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            // עכבר לסיבוב מצלמה
            window.addEventListener('mousedown', e => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#char-select')) return;
                isMouseDown = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isMouseDown = false);
            window.addEventListener('mousemove', e => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - prevMouseX;
                const deltaY = e.clientY - prevMouseY;
                cameraAngleX -= deltaX * 0.005;
                cameraAngleY = Math.max(0.05, Math.min(Math.PI / 2.2, cameraAngleY + deltaY * 0.005));
                prevMouseX = e.clientX; prevMouseY = e.clientY;
            });

            // ג'ויסטיק טאץ' למובייל
            joyZone.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.touches[0];
                joyTouchId = touch.identifier;
                joystickActive = true;
                updateJoystick(touch);
            }, { passive: false });

            window.addEventListener('touchmove', e => {
                if (!joystickActive) return;
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joyTouchId) {
                        updateJoystick(touch);
                        break;
                    }
                }
            }, { passive: false });

            const resetJoy = e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joyTouchId) {
                        joystickActive = false; joyTouchId = null;
                        joyKnob.style.transform = `translate(-50%, -50%)`;
                        moveVector = { x: 0, z: 0 };
                        break;
                    }
                }
            };
            window.addEventListener('touchend', resetJoy);
            window.addEventListener('touchcancel', resetJoy);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function updateJoystick(touch) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = rect.width / 2;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joyKnob.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
            moveVector = { x: dx / maxRadius, z: dy / maxRadius };
        }

        function animate() {
            requestAnimationFrame(animate);

            if (playerGroup) {
                // חישוב תנועה מול המצלמה
                let inputX = 0, inputZ = 0;

                if (keys['w'] || keys['arrowup']) inputZ -= 1;
                if (keys['s'] || keys['arrowdown']) inputZ += 1;
                if (keys['a'] || keys['arrowleft']) inputX -= 1;
                if (keys['d'] || keys['arrowright']) inputX += 1;

                if (joystickActive) {
                    inputX = moveVector.x;
                    inputZ = moveVector.z;
                }

                const isMoving = Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1;

                if (isMoving) {
                    const speed = 0.22;
                    // חישוב כיוון יחסי לזווית המצלמה
                    const moveAngle = Math.atan2(inputX, inputZ) + cameraAngleX;
                    
                    playerGroup.position.x += Math.sin(moveAngle) * speed;
                    playerGroup.position.z += Math.cos(moveAngle) * speed;
                    playerGroup.rotation.y = moveAngle + Math.PI;

                    // אנימציית הליכה זורמת
                    walkTime += 0.2;
                    leftLeg.rotation.x = Math.sin(walkTime) * 0.6;
                    rightLeg.rotation.x = -Math.sin(walkTime) * 0.6;
                    leftArm.rotation.x = -Math.sin(walkTime) * 0.5;
                    rightArm.rotation.x = Math.sin(walkTime) * 0.5;
                } else {
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                }

                // יציבות על הרצפה
                playerGroup.position.y = 0;

                // מצלמת גוף שלישי (Third-Person Camera)
                const camDistance = 14;
                const camX = playerGroup.position.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
                const camY = playerGroup.position.y + camDistance * Math.sin(cameraAngleY) + 2;
                const camZ = playerGroup.position.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);

                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2.2, playerGroup.position.z);

                // עדכון מיני-מאפ
                const miniPlayer = document.getElementById('minimap-player');
                if (miniPlayer) {
                    miniPlayer.style.transform = `translate(-50%, -50%) translate(${playerGroup.position.x * 0.4}px, ${playerGroup.position.z * 0.4}px)`;
                }
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
