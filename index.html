<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>אלוני אבא 3D - מובייל מתוקן</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }

        /* מסך בחירת דמויות */
        #char-select {
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(30,41,59,0.98) 0%, rgba(15,23,42,0.99) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 300; color: white; direction: rtl; padding: 20px;
        }
        #char-select h1 { font-size: 2.2rem; margin-bottom: 8px; color: #38bdf8; text-shadow: 0 0 15px rgba(56,189,248,0.4); text-align: center; }
        #char-select p { font-size: 1rem; color: #94a3b8; margin-bottom: 25px; }
        .char-grid { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
        .char-card {
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 15px; text-align: center; cursor: pointer;
            transition: all 0.25s ease; width: 140px; position: relative; overflow: hidden;
        }
        .char-card:active, .char-card:hover { transform: scale(1.05); border-color: #38bdf8; background: rgba(56, 189, 248, 0.12); }
        .char-avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .char-card h3 { font-size: 1rem; margin: 5px 0 2px; color: #f8fafc; }
        .char-card span { font-size: 0.75em; color: #38bdf8; font-weight: bold; }

        /* ממשק במשחק (UI) */
        #game-ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; display: none; }
        
        .header-card {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
            color: white; direction: rtl; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .header-card h2 { margin: 0; font-size: 1rem; color: #38bdf8; }
        .header-card div { font-size: 0.8rem; color: #cbd5e1; margin-top: 2px; }

        /* ג'ויסטיק ויירטואלי לשמאל */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            pointer-events: auto; backdrop-filter: blur(4px); touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; background: #38bdf8;
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(56,189,248,0.6); pointer-events: none;
        }

        /* אזור מגע מימין לסיבוב המצלמה */
        #touch-camera-zone {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            pointer-events: auto; touch-action: none; z-index: 90;
        }

        /* מפה קטנה */
        #minimap {
            position: absolute; top: 15px; left: 15px;
            width: 80px; height: 80px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3); background: rgba(15,23,42,0.85);
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none;
        }
        #minimap-player {
            position: absolute; top: 50%; left: 50%; width: 7px; height: 7px;
            background: #ef4444; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ef4444;
        }

        #instructions-bar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); color: #e2e8f0;
            padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; direction: rtl; text-align: center;
            pointer-events: none; white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- מסך בחירת דמות -->
    <div id="char-select">
        <h1>אלוני אבא 3D</h1>
        <p>בחר את הדמות שלך כדי להיכנס לעולם</p>
        <div class="char-grid">
            <div class="char-card" onclick="startGame('tal')">
                <div class="char-avatar" style="background: #ea580c;">👨‍🦰</div>
                <h3>טל גזית</h3>
                <span>חרבצ</span>
            </div>
            <div class="char-card" onclick="startGame('ido')">
                <div class="char-avatar" style="background: #1e293b;">👦</div>
                <h3>עידו דויץ</h3>
                <span>דויץ</span>
            </div>
            <div class="char-card" onclick="startGame('oz')">
                <div class="char-avatar" style="background: #16a34a;">🧒</div>
                <h3>עוז</h3>
                <span>קופמן</span>
            </div>
        </div>
    </div>

    <!-- ממשק המשחק -->
    <div id="game-ui">
        <div class="header-card">
            <h2>אלוני אבא</h2>
            <div id="player-label">דמות: טל גזית</div>
        </div>

        <div id="instructions-bar">
            ג'ויסטיק משמאל לתנועה | החלקת אצבע מימין לסיבוב מצלמה
        </div>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="touch-camera-zone"></div>
        <div id="minimap"><div id="minimap-player"></div></div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup, leftLeg, rightLeg, leftArm, rightArm;
        let walkTime = 0;

        // מצלמה ותנועה
        let cameraAngleX = 0, cameraAngleY = 0.35;
        const keys = {};
        let moveVector = { x: 0, z: 0 };

        // ג'ויסטיק טאץ'
        let joystickActive = false;
        let joyTouchId = null;
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');

        // סיבוב מצלמה בטאץ'
        let cameraTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;
        const touchCamZone = document.getElementById('touch-camera-zone');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xbae6fd);
            scene.fog = new THREE.FogExp2(0xbae6fd, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            setupLighting();
            buildWorld();
            setupEvents();
        }

        function setupLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfff7ed, 0.9);
            sun.position.set(60, 80, 40);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            scene.add(sun);
        }

        function buildWorld() {
            // דשא
            const groundGeo = new THREE.PlaneGeometry(250, 250);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ad66d, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // שביל אספלט מרכזי
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 200), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.02;
            road.receiveShadow = true;
            scene.add(road);

            // מבנים
            buildHouse(25, 0, -20, 0xdfe7f2);
            buildHouse(-25, 0, -10, 0xfef3c7);

            // עצים
            for (let z = -80; z <= 80; z += 25) {
                createTree(-14, z);
                createTree(14, z + 12);
            }
        }

        function buildHouse(x, y, z, colorHex) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 12), new THREE.MeshStandardMaterial({ color: colorHex }));
            body.position.y = 4; body.castShadow = true; body.receiveShadow = true;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(12, 5, 4), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
            roof.position.y = 10.5; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
            group.add(body, roof);
            group.position.set(x, y, z);
            scene.add(group);
        }

        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            trunk.position.y = 2; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2.5, 1), new THREE.MeshStandardMaterial({ color: 0x15803d }));
            leaves.position.y = 5; leaves.castShadow = true;
            tree.add(trunk, leaves);
            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        function createCharacter(type) {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();

            let shirtColor = 0x2563eb, hairColor = 0x1e293b, scaleY = 1;
            if (type === 'tal') { shirtColor = 0x16a34a; hairColor = 0xea580c; }
            else if (type === 'ido') { shirtColor = 0x0284c7; hairColor = 0x0f172a; scaleY = 1.15; }
            else if (type === 'oz') { shirtColor = 0x9333ea; hairColor = 0x451a03; scaleY = 0.85; }

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const hairMat = new THREE.MeshStandardMaterial({ color: hairColor });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6 * scaleY, 0.7), shirtMat);
            torso.position.y = 1.6 * scaleY; torso.castShadow = true; playerGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), skinMat);
            head.position.y = 2.85 * scaleY; head.castShadow = true; playerGroup.add(head);

            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.35, 0.96), hairMat);
            hair.position.y = 3.3 * scaleY; playerGroup.add(hair);

            const legGeo = new THREE.BoxGeometry(0.42, 1.2 * scaleY, 0.42);
            leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.28, 0.6 * scaleY, 0);
            leftLeg.geometry.translate(0, -0.3 * scaleY, 0); leftLeg.castShadow = true;

            rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.28, 0.6 * scaleY, 0);
            rightLeg.geometry.translate(0, -0.3 * scaleY, 0); rightLeg.castShadow = true;

            const armGeo = new THREE.BoxGeometry(0.32, 1.2 * scaleY, 0.32);
            leftArm = new THREE.Mesh(armGeo, shirtMat); leftArm.position.set(-0.75, 2.1 * scaleY, 0);
            leftArm.geometry.translate(0, -0.3 * scaleY, 0); leftArm.castShadow = true;

            rightArm = new THREE.Mesh(armGeo, shirtMat); rightArm.position.set(0.75, 2.1 * scaleY, 0);
            rightArm.geometry.translate(0, -0.3 * scaleY, 0); rightArm.castShadow = true;

            playerGroup.add(leftLeg, rightLeg, leftArm, rightArm);
            playerGroup.position.set(0, 0, 10);
            scene.add(playerGroup);
        }

        function startGame(type) {
            createCharacter(type);
            document.getElementById('char-select').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';

            const names = { 'tal': 'טל גזית (חרבצ)', 'ido': 'עידו דויץ (דויץ)', 'oz': 'עוז (קופמן)' };
            document.getElementById('player-label').innerText = 'דמות: ' + names[type];
        }

        function setupEvents() {
            // מקלדת למחשב
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            // --- טיפול בג'ויסטיק (שמאל) ---
            joyZone.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
                joystickActive = true;
                updateJoystick(touch);
            }, { passive: false });

            // --- טיפול בסיבוב מצלמה (ימין) ---
            touchCamZone.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                cameraTouchId = touch.identifier;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }, { passive: false });

            // --- תנועה משותפת לטאץ' ---
            window.addEventListener('touchmove', e => {
                for (let touch of e.changedTouches) {
                    if (joystickActive && touch.identifier === joyTouchId) {
                        updateJoystick(touch);
                    }
                    if (cameraTouchId !== null && touch.identifier === cameraTouchId) {
                        const deltaX = touch.clientX - lastTouchX;
                        const deltaY = touch.clientY - lastTouchY;
                        
                        cameraAngleX -= deltaX * 0.008;
                        cameraAngleY = Math.max(0.05, Math.min(Math.PI / 2.2, cameraAngleY + deltaY * 0.008));

                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            const handleTouchEnd = e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joyTouchId) {
                        joystickActive = false; joyTouchId = null;
                        joyKnob.style.transform = `translate(-50%, -50%)`;
                        moveVector = { x: 0, z: 0 };
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', handleTouchEnd);
            window.addEventListener('touchcancel', handleTouchEnd);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function updateJoystick(touch) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = rect.width / 2;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joyKnob.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
            moveVector = { x: dx / maxRadius, z: dy / maxRadius };
        }

        function animate() {
            requestAnimationFrame(animate);

            if (playerGroup) {
                let inputX = 0, inputZ = 0;

                if (keys['w'] || keys['arrowup']) inputZ -= 1;
                if (keys['s'] || keys['arrowdown']) inputZ += 1;
                if (keys['a'] || keys['arrowleft']) inputX -= 1;
                if (keys['d'] || keys['arrowright']) inputX += 1;

                if (joystickActive) {
                    inputX = moveVector.x;
                    inputZ = moveVector.z;
                }

                const isMoving = Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1;

                if (isMoving) {
                    const speed = 0.22;
                    const moveAngle = Math.atan2(inputX, inputZ) + cameraAngleX;
                    
                    playerGroup.position.x += Math.sin(moveAngle) * speed;
                    playerGroup.position.z += Math.cos(moveAngle) * speed;
                    playerGroup.rotation.y = moveAngle + Math.PI;

                    walkTime += 0.2;
                    leftLeg.rotation.x = Math.sin(walkTime) * 0.6;
                    rightLeg.rotation.x = -Math.sin(walkTime) * 0.6;
                    leftArm.rotation.x = -Math.sin(walkTime) * 0.5;
                    rightArm.rotation.x = Math.sin(walkTime) * 0.5;
                } else {
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                }

                playerGroup.position.y = 0;

                // חישוב המצלמה
                const camDistance = 14;
                const camX = playerGroup.position.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
                const camY = playerGroup.position.y + camDistance * Math.sin(cameraAngleY) + 2;
                const camZ = playerGroup.position.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);

                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2.2, playerGroup.position.z);

                const miniPlayer = document.getElementById('minimap-player');
                if (miniPlayer) {
                    miniPlayer.style.transform = `translate(-50%, -50%) translate(${playerGroup.position.x * 0.3}px, ${playerGroup.position.z * 0.3}px)`;
                }
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
